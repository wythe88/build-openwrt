name: Build OpenWrt ARMv8

on:
  workflow_dispatch:
    inputs:
      SOURCE:
        description: "选择源码"
        required: true
        default: "immwrt"
      DEVICE:
        description: "选择设备"
        required: true
        default: "s905d_s905x3"
      KERNEL:
        description: "内核版本"
        required: true
        default: "6.12.y"
      UPLOAD_ARTIFACT:
        description: "上传到 Artifact"
        required: true
        default: "true"
      UPLOAD_RELEASE:
        description: "上传到 Release"
        required: true
        default: "false"

permissions:
  contents: write   # 关键：允许创建 Release
  actions: read

env:
  TZ: Asia/Shanghai
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  OPENWRT_PATH: /workdir/openwrt

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 初始化环境
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            libncurses5-dev libssl-dev python3 python3-distutils rsync

      - name: 拉取源码
        run: |
          git clone $REPO_URL -b $REPO_BRANCH $OPENWRT_PATH

      - name: 更新 feeds
        run: |
          cd $OPENWRT_PATH
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 复制配置文件
        run: |
          cp configs/${{ github.event.inputs.DEVICE }}.config $OPENWRT_PATH/.config

      - name: 开始编译
        run: |
          cd $OPENWRT_PATH
          make defconfig
          make -j$(nproc) || make -j1 V=s

      - name: 上传 Artifact（永远执行）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: ${{ env.OPENWRT_PATH }}/bin/targets/

      - name: 上传 Release（可选）
        if: ${{ github.event.inputs.UPLOAD_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: armv8-${{ github.run_number }}
          name: ARMv8 Build
          files: ${{ env.OPENWRT_PATH }}/bin/targets/**/*
